version: "3.8"

services:
  db:
    image: postgres:13
    restart: always
    env_file:
      - .env.db
    environment:
      POSTGRES_DB: capstone_db2  # add this line
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    ports:
      - "8000:8000"       # Expose FastAPI on port 8000
    env_file:
      - .env              # FastAPI environment variables only
    depends_on:
      - db                # Ensure DB starts before web
    volumes:
      - .:/app            # Optional: live reload in dev, remove for production

volumes:
  postgres_data:
